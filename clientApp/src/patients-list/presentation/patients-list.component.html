<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">


  <ng-container matColumnDef="patientName">
    <th mat-header-cell *matHeaderCellDef> Patient Name </th>
    <td mat-cell *matCellDef="let element" >
      <div class="user-info">
           <mat-icon class="avatar" [style.background-image]="'url(https://example.com/avatar.jpg)'"></mat-icon>
    
        <p>{{element.patientName}}</p>
      </div>
       
        
     </td>
  </ng-container>

  
  <ng-container matColumnDef="nss">
    <th mat-header-cell *matHeaderCellDef> NSS </th>
    <td mat-cell *matCellDef="let element"> {{element.nss}} </td>
  </ng-container>

  
 
   <ng-container matColumnDef="phoneNumber">
    <th mat-header-cell *matHeaderCellDef> Phone Number </th>
    <td mat-cell *matCellDef="let element"> {{element.phoneNumber}} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let element"> {{element.email}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onRowClicked(row)"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5]"
                 aria-label="Select page of periodic elements">
</mat-paginator>


  

</div>
