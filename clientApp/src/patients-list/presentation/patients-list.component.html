<div>

    
    <mat-form-field appearance="fill">
    <input matInput [formControl]="searchControl" placeholder="Seach">
    <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button class="button" (click)="onSearch()">
        <mat-icon matSuffix>search</mat-icon>
    </button>

    <button class="button">
        <mat-icon matSuffix>home</mat-icon>
    </button>




<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">


  <ng-container matColumnDef="patientName">
    <th mat-header-cell *matHeaderCellDef> Patient Name </th>
    <td mat-cell *matCellDef="let element" >
        <Img width="40px" height="40px" src="https://ychef.files.bbci.co.uk/1280x720/p01kb9s7.jpg"/>
        <p>{{element.patientName}}</p>
        
     </td>
  </ng-container>

  
  <ng-container matColumnDef="age">
    <th mat-header-cell *matHeaderCellDef> Age </th>
    <td mat-cell *matCellDef="let element"> {{element.age}} </td>
  </ng-container>

  
  <ng-container matColumnDef="gender">
    <th mat-header-cell *matHeaderCellDef> Gender </th>
    <td mat-cell *matCellDef="let element"> {{element.gender}} </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="bloodGroup">
    <th mat-header-cell *matHeaderCellDef> Blood Group </th>
    <td mat-cell *matCellDef="let element"> {{element.bloodGroup}} </td>
  </ng-container>

   <ng-container matColumnDef="phoneNumber">
    <th mat-header-cell *matHeaderCellDef> Phone Number </th>
    <td mat-cell *matCellDef="let element"> {{element.phoneNumber}} </td>
  </ng-container>

  <ng-container matColumnDef="emailID">
    <th mat-header-cell *matHeaderCellDef> Email ID </th>
    <td mat-cell *matCellDef="let element"> {{element.emailID}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5]"
                 aria-label="Select page of periodic elements">
</mat-paginator>


  

</div>
